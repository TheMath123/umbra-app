<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#181325"/>
      <stop offset="1" stop-color="#0a0912"/>
    </linearGradient>
    <linearGradient id="corona" x1="230" y1="230" x2="794" y2="794" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8b4fe"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#bg)"/>

  <circle cx="512" cy="512" r="282" fill="url(#corona)" filter="url(#glow)"/>

  <circle cx="580" cy="468" r="282" fill="#0e0b16"/>
</svg>
